kind = "web"
previewPath = "/"
title = "Blackthorn Manor"
description = "A replayable gothic horror gamebook where players explore a living manor, uncover family secrets, survive supernatural encounters, and choose their escape from the curse."
version = "1.0.0"
id = "artifacts/blackthorn-manor"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19728

[services.development]
run = "pnpm --filter @workspace/blackthorn-manor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/blackthorn-manor", "run", "build" ]
serve = "static"
publicDir = "artifacts/blackthorn-manor/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19728"
BASE_PATH = "/"
